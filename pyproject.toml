[project]
name = "praetor"
version = "0.1.0"
description = "PRAETOR — a policy-governed, LLM-driven autonomous penetration-testing orchestrator. Recon → scan → exploit → report, gated by an explicit scope and a full audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = ["security", "pentest", "red-team", "autonomous-agent", "llm", "purple-team", "recon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
praetor = "praetor.cli:app"

[project.urls]
Homepage = "https://github.com/Danush-Aries/praetor"
Repository = "https://github.com/Danush-Aries/praetor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praetor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
